<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yongjae Lee</title>
    <script>
      // Runs before first paint so the default dark theme never flashes light.
      // Keep in sync with resolveTheme() in src/lib/theme.js.
      ;(function () {
        var stored = null
        try { stored = localStorage.getItem('theme') } catch (e) {}
        if (stored !== 'light') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
